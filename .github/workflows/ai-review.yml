name: AI Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SCAN_DIR: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract PR Body
        id: pr_body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          UUID=$(echo "$PR_BODY" | jq -r '.uuid // empty' 2>/dev/null || true)
          UUID="${UUID:-}"
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

          SLACK_USER_ID=$(echo "$PR_BODY" | jq -r '.slackId // empty' 2>/dev/null || true)
          SLACK_USER_ID="${SLACK_USER_ID:-}"
          [[ -n "$SLACK_USER_ID" && "$SLACK_USER_ID" != @* ]] && SLACK_USER_ID="@$SLACK_USER_ID"
          echo "slack_user_id=$SLACK_USER_ID" >> $GITHUB_OUTPUT

          FORM_EDIT_URL=$(echo "$PR_BODY" | jq -r '.editUrl // empty' 2>/dev/null || true)
          FORM_EDIT_URL="${FORM_EDIT_URL:-}"
          echo "form_edit_url=$FORM_EDIT_URL" >> $GITHUB_OUTPUT

          THREAD_TS=$(echo "$PR_BODY" | jq -r '.threadTs // .thread_ts // .threadId // empty' 2>/dev/null || true)
          echo "thread_ts=${THREAD_TS:-}" >> $GITHUB_OUTPUT
          CHANNEL_ID=$(echo "$PR_BODY" | jq -r '.channelId // .channel_id // empty' 2>/dev/null || true)
          echo "channel_id=${CHANNEL_ID:-}" >> $GITHUB_OUTPUT

          DESCRIPTION=$(echo "$PR_BODY" | jq -r '.description // empty' 2>/dev/null || true)
          echo "description=${DESCRIPTION:-}" >> $GITHUB_OUTPUT
          APIS=$(echo "$PR_BODY" | jq -r '.apis // empty' 2>/dev/null || true)
          echo "apis=${APIS:-}" >> $GITHUB_OUTPUT

      - name: Find And Unzip
        run: |
          mkdir -p ${{ env.SCAN_DIR }} reports
          for z in $(ls scan-targets/*.zip 2>/dev/null | head -n 10); do
            echo "Unzipping $z"
            unzip -O CP950 -o "$z" -d ${{ env.SCAN_DIR }} || unzip -o "$z" -d ${{ env.SCAN_DIR }}
          done

      - name: Verify Source And Check
        id: check_source
        env:
          UUID: ${{ steps.pr_body.outputs.uuid }}
        run: |
          echo "SCAN_DIR=${{ env.SCAN_DIR }}"
          echo "Contents of SCAN_DIR:"
          ls -la ${{ env.SCAN_DIR }} || true
          echo "Source tree (first 50 files):"
          find ${{ env.SCAN_DIR }} -type f 2>/dev/null | head -n 50 || true

          FIRST_FILE=$(find ${{ env.SCAN_DIR }} -type f 2>/dev/null | head -1)
          echo "FIRST_FILE=[$FIRST_FILE]"
          FILE_NAME=$(basename "$FIRST_FILE")
          HAS_FILES=false
          [ -n "$FIRST_FILE" ] && HAS_FILES=true
          RUN_SCANS=false
          [ "$HAS_FILES" = true ] && [ -n "$UUID" ] && RUN_SCANS=true

          echo "file_name<<ENDFILENAME" >> $GITHUB_OUTPUT
          echo "${FILE_NAME:-}" >> $GITHUB_OUTPUT
          echo "ENDFILENAME" >> $GITHUB_OUTPUT
          echo "has_files=$HAS_FILES" >> $GITHUB_OUTPUT
          echo "run_scans=$RUN_SCANS" >> $GITHUB_OUTPUT

      # --------------------
      # Security Scans + Score + Report
      # --------------------
      - name: Run Security Scans
        id: scans
        if: steps.check_source.outputs.run_scans == 'true'
        uses: ./.github/actions/run-security-scans
        with:
          scan_dir: ${{ env.SCAN_DIR }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          file_name: ${{ steps.check_source.outputs.file_name }}
          description: ${{ steps.pr_body.outputs.description }}
          apis: ${{ steps.pr_body.outputs.apis }}

      # --------------------
      # Upload Report Artifact
      # --------------------
      - name: Upload Report
        id: upload-report
        if: steps.check_source.outputs.run_scans == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report
          path: reports/

      # --------------------
      # Update Sheet
      # --------------------
      - name: Update Sheet
        if: steps.check_source.outputs.run_scans == 'true'
        uses: ./.github/actions/update-sheet
        with:
          uuid: ${{ steps.pr_body.outputs.uuid }}
          patch_json: '{"9":"SCANNED","11":"${{ steps.upload-report.outputs.artifact-url }}","12":"${{ steps.scans.outputs.codeql }}","13":"${{ steps.scans.outputs.semgrep }}","14":"${{ steps.scans.outputs.gemini }}","15":"${{ steps.scans.outputs.openai }}","16":"${{ steps.scans.outputs.avg }}","17":"${{ steps.scans.outputs.verdict }}"}'
          sheet_api_url: ${{ secrets.SHEET_API_URL }}
          sheet_api_token: ${{ secrets.SHEET_API_TOKEN }}

      # --------------------
      # Notify Slack
      # --------------------
      - name: Notify Slack With Actions
        id: notify_slack
        if: steps.check_source.outputs.run_scans == 'true'
        uses: ./.github/actions/slack-notify-review
        with:
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_user_id: ${{ steps.pr_body.outputs.slack_user_id }}
          file_name: ${{ steps.check_source.outputs.file_name }}
          form_edit_url: ${{ steps.pr_body.outputs.form_edit_url }}
          uuid: ${{ steps.pr_body.outputs.uuid }}
          branch: ${{ github.head_ref || github.ref_name }}
          pr_number: ${{ github.event.pull_request.number }}
          existing_thread_ts: ${{ steps.pr_body.outputs.thread_ts }}
          existing_channel_id: ${{ steps.pr_body.outputs.channel_id }}
          codeql: ${{ steps.scans.outputs.codeql }}
          semgrep: ${{ steps.scans.outputs.semgrep }}
          gemini: ${{ steps.scans.outputs.gemini }}
          openai: ${{ steps.scans.outputs.openai }}
          avg: ${{ steps.scans.outputs.avg }}
          verdict: ${{ steps.scans.outputs.verdict }}

      # --------------------
      # Upload Reports To Slack
      # --------------------
      - name: Upload Reports To Slack
        if: steps.check_source.outputs.run_scans == 'true'
        uses: ./.github/actions/slack-upload-file
        with:
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          file_path: ${{ steps.scans.outputs.report_path }}
          channel_id: ${{ steps.notify_slack.outputs.channel_id }}
          thread_ts: ${{ steps.notify_slack.outputs.thread_ts }}
