name: AI Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SCAN_DIR: src
      SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
      SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract PR Body
        id: pr_body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          UUID=$(echo "$PR_BODY" | jq -r '.uuid // empty' 2>/dev/null || true)
          UUID="${UUID:-}"
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

          SLACK_USER_ID=$(echo "$PR_BODY" | jq -r '.slackId // empty' 2>/dev/null || true)
          SLACK_USER_ID="${SLACK_USER_ID:-}"
          [[ -n "$SLACK_USER_ID" && "$SLACK_USER_ID" != @* ]] && SLACK_USER_ID="@$SLACK_USER_ID"
          echo "slack_user_id=$SLACK_USER_ID" >> $GITHUB_OUTPUT

          FORM_EDIT_URL=$(echo "$PR_BODY" | jq -r '.editUrl // empty' 2>/dev/null || true)
          FORM_EDIT_URL="${FORM_EDIT_URL:-}"
          echo "form_edit_url=$FORM_EDIT_URL" >> $GITHUB_OUTPUT

      - name: Find And Unzip
        run: |
          mkdir -p ${{ env.SCAN_DIR }} reports
          for z in $(ls scan-targets/*.zip 2>/dev/null | head -n 10); do
            echo "Unzipping $z"
            # -O CP950：ZIP 內檔名為 Windows 繁體中文 (Big5)，解壓時轉成 UTF-8，避免亂碼
            unzip -O CP950 -o "$z" -d ${{ env.SCAN_DIR }} || unzip -o "$z" -d ${{ env.SCAN_DIR }}
          done

      - name: Verify Source And Check
        id: check_source
        env:
          UUID: ${{ steps.pr_body.outputs.uuid }}
        run: |
          echo "SCAN_DIR=${{ env.SCAN_DIR }}"
          echo "Contents of SCAN_DIR:"
          ls -la ${{ env.SCAN_DIR }} || true
          echo "Source tree (first 50 files):"
          find ${{ env.SCAN_DIR }} -type f 2>/dev/null | head -n 50 || true

          FIRST_FILE=$(find ${{ env.SCAN_DIR }} -type f 2>/dev/null | head -1)
          echo "FIRST_FILE=[$FIRST_FILE]"
          FILE_NAME=$(basename "$FIRST_FILE")
          HAS_FILES=false
          [ -n "$FIRST_FILE" ] && HAS_FILES=true
          RUN_SCANS=false
          [ "$HAS_FILES" = true ] && [ -n "$UUID" ] && RUN_SCANS=true

          # 用 delimiter 寫入，避免檔名含空格、括號、中文時被截斷
          echo "file_name<<ENDFILENAME" >> $GITHUB_OUTPUT
          echo "${FILE_NAME:-}" >> $GITHUB_OUTPUT
          echo "ENDFILENAME" >> $GITHUB_OUTPUT
          echo "has_files=$HAS_FILES" >> $GITHUB_OUTPUT
          echo "run_scans=$RUN_SCANS" >> $GITHUB_OUTPUT

      # --------------------
      # CodeQL
      # --------------------
      - name: Init CodeQL
        if: steps.check_source.outputs.run_scans == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          source-root: ${{ env.SCAN_DIR }}

      - name: Run CodeQL
        if: steps.check_source.outputs.run_scans == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          output: reports

      - name: Copy CodeQL SARIF
        if: steps.check_source.outputs.run_scans == 'true'
        run: cp reports/javascript.sarif reports/codeql.sarif

      - name: Create empty CodeQL SARIF
        if: steps.check_source.outputs.run_scans != 'true'
        run: |
          echo '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif/master/schemata/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"CodeQL","rules":[]}},"results":[]}]}' > reports/codeql.sarif

      # --------------------
      # Install Semgrep
      # --------------------
      - name: Install Semgrep
        if: steps.check_source.outputs.run_scans == 'true'
        run: pip install semgrep

      # --------------------
      # Semgrep
      # --------------------
      - name: Run Semgrep
        if: steps.check_source.outputs.run_scans == 'true'
        run: |
          semgrep scan src --config=.github/scripts/semgrep.yml --json > reports/semgrep.json

      - name: Create empty Semgrep JSON
        if: steps.check_source.outputs.run_scans != 'true'
        run: echo '{"results":[]}' > reports/semgrep.json

      # --------------------
      # Gemini AI Scan
      # --------------------
      - name: Gemini Scan
        if: steps.check_source.outputs.run_scans == 'true'
        run: node .github/scripts/gemini_scan.js

      - name: Create empty Gemini JSON
        if: steps.check_source.outputs.run_scans != 'true'
        run: echo '{"engine":"gemini","summary":"No source to scan","severity":"low","details":[]}' > reports/gemini.json

      # --------------------
      # OpenAI Scan (optional)
      # --------------------
      - name: OpenAI Scan
        if: steps.check_source.outputs.run_scans == 'true'
        run: node .github/scripts/openai_scan.js

      - name: Create empty OpenAI JSON
        if: steps.check_source.outputs.run_scans != 'true'
        run: echo '{"engine":"openai","summary":"No source to scan","severity":"low","details":[]}' > reports/openai.json

      # --------------------
      # Score Results
      # --------------------
      - name: Score Results
        run: node .github/scripts/score.js

      # --------------------
      # Export Score to env
      # --------------------
      - name: Export Score
        run: |
          CODEQL=$(jq -r .codeql reports/score.json)
          SEMGREP=$(jq -r .semgrep reports/score.json)
          GEMINI=$(jq -r .gemini reports/score.json)
          OPENAI=$(jq -r .openai reports/score.json)
          AVG=$(jq -r .avg reports/score.json)
          VERDICT=$(jq -r .verdict reports/score.json)

          echo "CODEQL=$CODEQL" >> $GITHUB_ENV
          echo "SEMGREP=$SEMGREP" >> $GITHUB_ENV
          echo "GEMINI=$GEMINI" >> $GITHUB_ENV
          echo "OPENAI=$OPENAI" >> $GITHUB_ENV
          echo "AVG=$AVG" >> $GITHUB_ENV
          echo "VERDICT=$VERDICT" >> $GITHUB_ENV

          if [[ "$VERDICT" == *"PASS"* ]]; then
            echo "TOTAL=PASS" >> $GITHUB_ENV
          else
            echo "TOTAL=FAIL" >> $GITHUB_ENV
          fi

      # --------------------
      # Build Report
      # --------------------
      - name: Build Report
        run: node .github/scripts/build_report.js

      # --------------------
      # Upload Report Artifact
      # --------------------
      - name: Upload Report
        id: upload-report
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report
          path: reports/

      # --------------------
      # Notify Sheet
      # --------------------
      - name: Update Sheet
        if: steps.check_source.outputs.run_scans == 'true'
        env:
          UUID: ${{ steps.pr_body.outputs.uuid }}
          ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        run: |
          CURRENT_TIME=$(node -e "console.log(new Date().toISOString())")
          BODY="{
            \"token\": \"$SHEET_API_TOKEN\",
            \"action\": \"update\",
            \"uuid\": \"$UUID\",
            \"patch\": {
              \"2\": \"${CURRENT_TIME}\",
              \"7\": \"SCANNED\",
              \"9\": \"${ARTIFACT_URL}\",
              \"10\": \"${CODEQL}\",
              \"11\": \"${SEMGREP}\",
              \"12\": \"${GEMINI}\",
              \"13\": \"${OPENAI}\",
              \"14\": \"${AVG}\",
              \"15\": \"${VERDICT}\"
            }
          }"

          echo "=== curl 目標 ==="
          echo "URL: $SHEET_API_URL"
          echo "Method: POST"
          echo ""
          echo "=== Header ==="
          echo "Content-Type: application/json"
          echo ""
          echo "=== Body ==="
          echo "$BODY"
          echo ""

          curl -X POST "$SHEET_API_URL" \
            -H "Content-Type: application/json" \
            -d "$BODY"
      - name: Notify Slack With Actions
        id: notify_slack
        env:
          SLACK_USER_ID: ${{ steps.pr_body.outputs.slack_user_id }}
          FILE_NAME: ${{ steps.check_source.outputs.file_name }}
          FORM_EDIT_URL: ${{ steps.pr_body.outputs.form_edit_url }}
          UUID: ${{ steps.pr_body.outputs.uuid }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "FILE_NAME in notify step: [$FILE_NAME]"

          # Phase 1: 先發一則暫存訊息，取得 ts 與 channel
          RESPONSE=$(curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"channel": "'"$SLACK_USER_ID"'", "text": "AI Review 結果載入中…"}')
          echo "chat.postMessage response: $RESPONSE"
          THREAD_TS=$(echo "$RESPONSE" | jq -r '.ts // empty')
          CHANNEL_ID=$(echo "$RESPONSE" | jq -r '.channel // empty')
          if [ -z "$THREAD_TS" ] || [ -z "$CHANNEL_ID" ]; then
            echo "Error: failed to get ts or channel from postMessage"
            exit 1
          fi

          # 組 entry.2025086705 的值（JSON 後 URL-encode）
          ENTRY_JSON=$(jq -n -c --arg u "$UUID" --arg t "$THREAD_TS" --arg c "$CHANNEL_ID" '{UUID:$u,THREAD_TS:$t,CHANNEL_ID:$c}')
          ENTRY_VALUE=$(printf '%s' "$ENTRY_JSON" | jq -sRr @uri)
          RESUBMIT_URL="${FORM_EDIT_URL}&entry.2025086705=${ENTRY_VALUE}"

          # Phase 2: chat.update 更新為完整 blocks，按鈕 URL 帶入 THREAD_TS & CHANNEL_ID
          if [[ "$VERDICT" == *"PASS"* ]]; then
            UPDATE_PAYLOAD=$(jq -n -c \
              --arg ch "$CHANNEL_ID" \
              --arg ts "$THREAD_TS" \
              --arg file_name "$FILE_NAME" \
              --arg verdict "$VERDICT" \
              --arg codeql "$CODEQL" \
              --arg semgrep "$SEMGREP" \
              --arg gemini "$GEMINI" \
              --arg openai "$OPENAI" \
              --arg avg "$AVG" \
              --arg uuid "$UUID" \
              --arg branch "$BRANCH" \
              --arg pr_number "$PR_NUMBER" \
              --arg slack_user_id "$SLACK_USER_ID" \
              --arg resubmit_url "$RESUBMIT_URL" \
              '{
                channel: $ch,
                ts: $ts,
                attachments: [{
                  color: "#2EB67D",
                  blocks: [
                    {type: "section", text: {type: "mrkdwn", text: (":white_check_mark: 你提交的檔案 => *" + $file_name + "* :star-struck: *已通過審核*")}},
                    {type: "section", text: {type: "mrkdwn", text: ("*AI Review 結果如下*\n\n• 風險: *" + $verdict + "*\n• CodeQL: " + $codeql + "\n• SemGrep: " + $semgrep + "\n• Gemini Scan: " + $gemini + "\n• OpenAI Scan: " + $openai + "\n• Avg: *" + $avg + "*")}},
                    {type: "section", text: {type: "mrkdwn", text: "_詳細請參考訊息內的附件_\n\n現在請你選擇操作："}},
                    {type: "actions", elements: [
                      {type: "button", text: {type: "plain_text", text: "確認上傳檔案"}, style: "primary", value: ({"action_id":"confirm_upload","uuid":$uuid,"branch":$branch,"pr_number":$pr_number,"slack_user_id":$slack_user_id} | @json), action_id: "confirm_upload"},
                      {type: "button", text: {type: "plain_text", text: "重新提交檔案"}, url: $resubmit_url, value: "resubmit", action_id: "resubmit"},
                      {type: "button", text: {type: "plain_text", text: "結束這次 review"}, style: "danger", value: ({"action_id":"cancel_review","uuid":$uuid,"branch":$branch,"pr_number":$pr_number,"slack_user_id":$slack_user_id} | @json), action_id: "cancel_review"}
                    ]}
                  ]
                }]
              }')
          else
            UPDATE_PAYLOAD=$(jq -n -c \
              --arg ch "$CHANNEL_ID" \
              --arg ts "$THREAD_TS" \
              --arg file_name "$FILE_NAME" \
              --arg verdict "$VERDICT" \
              --arg codeql "$CODEQL" \
              --arg semgrep "$SEMGREP" \
              --arg gemini "$GEMINI" \
              --arg openai "$OPENAI" \
              --arg avg "$AVG" \
              --arg uuid "$UUID" \
              --arg branch "$BRANCH" \
              --arg pr_number "$PR_NUMBER" \
              --arg slack_user_id "$SLACK_USER_ID" \
              --arg resubmit_url "$RESUBMIT_URL" \
              '{
                channel: $ch,
                ts: $ts,
                attachments: [{
                  color: "#E01E5A",
                  blocks: [
                    {type: "section", text: {type: "mrkdwn", text: (":x: 你提交的檔案 => *" + $file_name + "* :melting_face: *未通過審核*")}},
                    {type: "section", text: {type: "mrkdwn", text: ("*AI Review 結果如下*\n\n• 風險: *" + $verdict + "*\n• CodeQL: " + $codeql + "\n• SemGrep: " + $semgrep + "\n• Gemini Scan: " + $gemini + "\n• OpenAI Scan: " + $openai + "\n• Avg: *" + $avg + "*")}},
                    {type: "section", text: {type: "mrkdwn", text: "_詳細請參考訊息內的附件_\n\n現在請你選擇操作："}},
                    {type: "actions", elements: [
                      {type: "button", text: {type: "plain_text", text: "重新提交檔案"}, url: $resubmit_url, value: "resubmit", action_id: "resubmit"},
                      {type: "button", text: {type: "plain_text", text: "取消這次 review"}, style: "danger", value: ({"action_id":"cancel_review","uuid":$uuid,"branch":$branch,"pr_number":$pr_number,"slack_user_id":$slack_user_id} | @json), action_id: "cancel_review"}
                    ]}
                  ]
                }]
              }')
          fi

          curl -s -X POST https://slack.com/api/chat.update \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$UPDATE_PAYLOAD"

          echo "thread_ts=${THREAD_TS}" >> $GITHUB_OUTPUT
          echo "channel_id=${CHANNEL_ID}" >> $GITHUB_OUTPUT

      - name: Upload Reports To Slack
        env:
          SLACK_USER_ID: ${{ steps.pr_body.outputs.slack_user_id }}
          THREAD_TS: ${{ steps.notify_slack.outputs.thread_ts }}
          CHANNEL_ID: ${{ steps.notify_slack.outputs.channel_id }}
        run: |
          for FILE in reports/*; do
            [ -f "$FILE" ] || continue

            echo "Uploading $FILE"
            FILE_SIZE=$(wc -c < "$FILE")
            FILE_NAME=$(basename "$FILE")

            # 取得 upload URL
            echo "=== get upload URL ==="
            echo "FILE_NAME=$FILE_NAME FILE_SIZE=$FILE_SIZE"
            RESPONSE=$(curl -s -S -X POST https://slack.com/api/files.getUploadURLExternal \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "filename=$FILE_NAME" \
              --data-urlencode "length=$FILE_SIZE")
            echo "getUploadURLExternal response: $RESPONSE"

            UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.upload_url // empty')
            FILE_ID=$(echo "$RESPONSE" | jq -r '.file_id // empty')

            if [ -z "$UPLOAD_URL" ] || [ -z "$FILE_ID" ]; then
              echo "Error: getUploadURLExternal failed: $RESPONSE"
              exit 1
            fi

            # 上傳 binary
            echo "=== upload binary ==="
            echo "UPLOAD_URL=$UPLOAD_URL FILE=$FILE"
            RESPONSE_PUT=$(curl -s -f -X POST "$UPLOAD_URL" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$FILE")
            echo "POST response: $RESPONSE_PUT"

            # 完成上傳並指定 thread
            echo "=== to thread ==="
            echo "FILE_ID=$FILE_ID FILE_NAME=$FILE_NAME CHANNEL_ID=$CHANNEL_ID THREAD_TS=$THREAD_TS"
            RESPONSE_COMPLETE=$(curl -s -S -X POST https://slack.com/api/files.completeUploadExternal \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "files=[{\"id\":\"$FILE_ID\",\"title\":\"$FILE_NAME\"}]" \
              --data-urlencode "channel_id=$CHANNEL_ID" \
              --data-urlencode "thread_ts=$THREAD_TS")
            echo "completeUploadExternal response: $RESPONSE_COMPLETE"

          done
