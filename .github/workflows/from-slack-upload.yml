name: From Slack Upload

run-name: "[AI-REVIEW][Slack Action] Upload - ${{ github.event.inputs.uuid }}"

on:
  workflow_dispatch:
    inputs:
      uuid:
        required: true
      pr_number:
        required: true
      branch:
        required: true
      action:
        required: true
      slack_user_id:
        required: true
      response_url:
        required: true
      original_blocks_base64:
        required: true
      attachment_color:
        required: true

jobs:
  handle-click-upload-button:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
      SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Slack Inputs
        id: inputs
        uses: ./.github/actions/parse-slack-inputs
        with:
          uuid: ${{ github.event.inputs.uuid }}
          pr_number: ${{ github.event.inputs.pr_number }}
          branch: ${{ github.event.inputs.branch }}
          action: ${{ github.event.inputs.action }}
          slack_user_id: ${{ github.event.inputs.slack_user_id }}
          original_blocks_base64: ${{ github.event.inputs.original_blocks_base64 }}

      - name: Check PR State
        id: check_pr
        uses: ./.github/actions/check-pr-state
        with:
          pr_number: ${{ steps.inputs.outputs.pr_number }}
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}

      - name: Upload File To S3
        if: steps.check_pr.outputs.already_closed != 'true'
        id: upload
        run: |
          UPLOADED_URL="https://s.yimg.com/br/yahoo-tw-media/game-center/staging/home/index.html"
          echo "url=$UPLOADED_URL" >> $GITHUB_OUTPUT

      - name: Update Sheet (USER_UPLOADED)
        if: steps.check_pr.outputs.already_closed != 'true' && steps.upload.outputs.url != ''
        uses: ./.github/actions/update-sheet
        with:
          uuid: ${{ steps.inputs.outputs.uuid }}
          patch_json: '{"7":"USER_UPLOADED","16":"${{ steps.upload.outputs.url }}"}'
          sheet_api_url: ${{ secrets.SHEET_API_URL }}
          sheet_api_token: ${{ secrets.SHEET_API_TOKEN }}

      - name: Close PR
        if: steps.check_pr.outputs.already_closed != 'true' && steps.upload.outputs.url != ''
        id: close_pr
        continue-on-error: true
        uses: ./.github/actions/close-pr
        with:
          pr_number: ${{ steps.inputs.outputs.pr_number }}
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}

      - name: Notify Slack
        if: steps.check_pr.outputs.already_closed != 'true'
        uses: ./.github/actions/slack-respond
        with:
          response_url: ${{ github.event.inputs.response_url }}
          attachment_color: ${{ github.event.inputs.attachment_color }}
          is_success: ${{ steps.close_pr.outputs.success }}
          success_text: ':white_check_mark: 已上傳檔案\n<${{ steps.upload.outputs.url }}|開啟連結>'
          fail_text: ':x: 上傳失敗，請再重新按一次'
